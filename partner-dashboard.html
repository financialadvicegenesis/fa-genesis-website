<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="assets/images/logo-favicon-192.png">
<title>Espace Prestataire — FA GENESIS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#0d0d0d;--bg2:#141414;--card:#161616;--border:#252525;--gold:#FFD700;--gold2:#e6c200;--text:#f0f0f0;--muted:#666;--muted2:#444;--nav:64px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
/* ── Header ── */
#hdr{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;z-index:200;gap:10px}
#hdr .logo{height:32px;width:32px;border-radius:50%;object-fit:cover}
#hdr .brand{font-size:15px;font-weight:900;letter-spacing:.5px;color:var(--gold);flex:1}
#hdr .badge-pill{background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);color:var(--gold);font-size:9px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:20px}
#hdr .avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#000;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* ── Content ── */
#main{position:fixed;top:56px;left:0;right:0;bottom:calc(var(--nav) + var(--safe));overflow-y:auto;-webkit-overflow-scrolling:touch}
/* ── Bottom nav ── */
#bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);padding-bottom:var(--safe);background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:200}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;transition:color .2s}
.bnav-btn i{font-size:20px}
.bnav-btn.on{color:var(--gold)}
/* ── Sections ── */
.section{display:none;padding:16px 16px 24px}
.section.on{display:block}
/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card-row{display:flex;align-items:center;gap:12px}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3}
.card-sub{font-size:12px;color:var(--muted);line-height:1.5}
.card-meta{font-size:11px;color:var(--muted2)}
/* ── Stat grid ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center}
.stat-num{font-size:26px;font-weight:900;color:var(--gold);line-height:1}
.stat-label{font-size:10px;color:var(--muted);margin-top:4px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
/* ── Welcome banner ── */
.welcome-banner{background:linear-gradient(135deg,#1a1200 0%,#0d0d0d 100%);border:1px solid rgba(255,215,0,.2);border-radius:14px;padding:18px 16px;margin-bottom:14px}
.welcome-banner h2{font-size:17px;font-weight:900;color:var(--gold);margin-bottom:4px}
.welcome-banner p{font-size:12px;color:#999;line-height:1.5}
/* ── Section header ── */
.sec-hdr{font-size:10px;font-weight:900;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* ── Badge pill ── */
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:800}
.pill-green{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22c55e}
.pill-yellow{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);color:var(--gold)}
.pill-red{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.pill-blue{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#60a5fa}
.pill-grey{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted)}
/* ── Action button ── */
.btn-gold{background:var(--gold);color:#000;font-weight:900;font-size:13px;border:none;border-radius:10px;padding:12px 20px;cursor:pointer;width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-outline{background:transparent;color:var(--gold);font-weight:700;font-size:13px;border:1.5px solid rgba(255,215,0,.3);border-radius:10px;padding:11px 20px;cursor:pointer;width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-red{background:transparent;color:#ef4444;font-weight:700;font-size:13px;border:1.5px solid rgba(239,68,68,.3);border-radius:10px;padding:11px 20px;cursor:pointer;width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
/* ── Empty state ── */
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty i{font-size:36px;margin-bottom:12px;display:block;opacity:.3}
.empty p{font-size:13px;line-height:1.6}
/* ── Profil ── */
.pf-avatar{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#000;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;flex-shrink:0}
.pf-name{font-size:18px;font-weight:900;text-align:center;color:var(--text)}
.pf-type{font-size:12px;color:var(--muted);text-align:center;margin-top:3px}
.pf-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.pf-row:last-child{border-bottom:none}
.pf-row i{color:var(--gold);width:20px;text-align:center}
.pf-row .label{font-size:12px;color:var(--muted);display:block}
.pf-row .val{font-size:14px;color:var(--text);font-weight:600}
/* ── Loading spinner ── */
.spinner{text-align:center;padding:40px;color:var(--gold);opacity:.4}
.spinner i{font-size:24px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Splash / login check ── */
#splash-check{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
#splash-check img{width:72px;height:72px;border-radius:50%}
#splash-check .lbl{color:var(--gold);font-size:13px;font-weight:700;letter-spacing:1px}
/* ── Separator ── */
.sep{height:1px;background:var(--border);margin:14px 0}
/* ── Input (devis respond) ── */
.dv-actions{display:flex;gap:8px;margin-top:10px}
.dv-actions button{flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:700;border:none;cursor:pointer}
.btn-accept{background:var(--gold);color:#000}
.btn-refuse{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)!important;color:#ef4444}
.dv-actions button:disabled{opacity:.5;cursor:default}
/* ── Toast ── */
#toast{position:fixed;bottom:calc(var(--nav) + 16px);left:50%;transform:translateX(-50%) translateY(60px);background:var(--gold);color:#000;font-size:12px;font-weight:900;padding:10px 20px;border-radius:20px;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Splash d'authentification -->
<div id="splash-check">
  <img src="assets/images/logo-favicon-192.png" alt="GENESIS" onerror="this.style.display='none'">
  <span class="lbl">Vérification en cours…</span>
</div>

<!-- Header -->
<header id="hdr" style="display:none">
  <img class="logo" src="assets/images/logo-favicon-192.png" alt="GENESIS" onerror="this.style.display='none'">
  <span class="brand">FA GENESIS</span>
  <span class="badge-pill" id="hdr-badge">PRESTATAIRE</span>
  <div class="avatar" id="hdr-avatar" title="Profil" onclick="goSection('profil')">P</div>
</header>

<!-- Contenu principal -->
<main id="main" style="display:none">

  <!-- ── ACCUEIL ── -->
  <div class="section on" id="sec-accueil">
    <div class="welcome-banner">
      <h2 id="welcome-name">Bonjour 👋</h2>
      <p id="welcome-sub">Votre tableau de bord GENESIS</p>
    </div>
    <div class="stat-grid" id="stat-grid">
      <div class="stat-card"><div class="stat-num" id="stat-devis">—</div><div class="stat-label">Devis en attente</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-missions">—</div><div class="stat-label">Missions actives</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-seances">—</div><div class="stat-label">Séances à venir</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-docs">—</div><div class="stat-label">Documents</div></div>
    </div>
    <div class="sec-hdr"><i class="fa-solid fa-inbox"></i>Derniers devis reçus</div>
    <div id="home-devis-list"><div class="spinner"><i class="fa-solid fa-spinner"></i></div></div>
  </div>

  <!-- ── DEVIS ── -->
  <div class="section" id="sec-devis">
    <div class="sec-hdr"><i class="fa-solid fa-file-invoice"></i>Mes devis</div>
    <div id="devis-list"><div class="spinner"><i class="fa-solid fa-spinner"></i></div></div>
  </div>

  <!-- ── SÉANCES ── -->
  <div class="section" id="sec-seances">
    <div class="sec-hdr"><i class="fa-solid fa-calendar-check"></i>Mes séances</div>
    <div id="seances-list"><div class="spinner"><i class="fa-solid fa-spinner"></i></div></div>
  </div>

  <!-- ── DOCUMENTS (LIVRABLES) ── -->
  <div class="section" id="sec-documents">
    <div class="sec-hdr"><i class="fa-solid fa-folder-open"></i>Mes documents</div>
    <div id="docs-list"><div class="spinner"><i class="fa-solid fa-spinner"></i></div></div>
  </div>

  <!-- ── PROFIL ── -->
  <div class="section" id="sec-profil">
    <div class="card" style="text-align:center;padding:24px 16px">
      <div class="pf-avatar" id="pf-avatar">P</div>
      <div class="pf-name" id="pf-name">—</div>
      <div class="pf-type" id="pf-type">—</div>
      <div style="margin-top:8px" id="pf-badge-row"></div>
    </div>
    <div class="card" id="pf-info"></div>
    <button class="btn-outline" onclick="goSection('documents')"><i class="fa-solid fa-file-contract"></i>Mes contrats &amp; livrables</button>
    <button class="btn-red" onclick="doLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i>Se déconnecter</button>
    <div style="height:8px"></div>
    <p style="font-size:10px;color:var(--muted);text-align:center">FA GENESIS — Espace Prestataire</p>
  </div>

</main>

<!-- Navigation basse -->
<nav id="bnav" style="display:none">
  <button class="bnav-btn on" onclick="goSection('accueil')" id="btn-accueil"><i class="fa-solid fa-house"></i>Accueil</button>
  <button class="bnav-btn" onclick="goSection('devis')" id="btn-devis"><i class="fa-solid fa-file-invoice"></i>Devis</button>
  <button class="bnav-btn" onclick="goSection('seances')" id="btn-seances"><i class="fa-solid fa-calendar-check"></i>Séances</button>
  <button class="bnav-btn" onclick="goSection('documents')" id="btn-documents"><i class="fa-solid fa-folder-open"></i>Documents</button>
  <button class="bnav-btn" onclick="goSection('profil')" id="btn-profil"><i class="fa-solid fa-user"></i>Profil</button>
</nav>

<!-- Toast -->
<div id="toast"></div>

<script>
var API = 'https://fa-genesis-website.onrender.com';
var _token = localStorage.getItem('fa_genesis_partner_token');
var _partner = null;
var _loaded = {};
var _currentSection = 'accueil';

// ── Auth check ──────────────────────────────────────
(function init(){
  if(!_token){ goLogin(); return; }
  fetch(API+'/api/partner/auth/me',{headers:{'Authorization':'Bearer '+_token}})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if(!data || !data.partner){ goLogin(); return; }
      _partner = data.partner;
      bootDashboard();
    })
    .catch(function(){ goLogin(); });
})();

function goLogin(){ window.location.replace('partner-login.html'); }

function bootDashboard(){
  document.getElementById('splash-check').style.display = 'none';
  document.getElementById('hdr').style.display = '';
  document.getElementById('main').style.display = '';
  document.getElementById('bnav').style.display = '';

  var fn = ((_partner.prenom||'')+' '+(_partner.nom||'')).trim() || _partner.email;
  var ini = (fn[0]||'P').toUpperCase();
  document.getElementById('hdr-avatar').textContent = ini;
  document.getElementById('welcome-name').textContent = 'Bonjour, '+fn+' 👋';
  document.getElementById('welcome-sub').textContent = 'Bienvenue dans votre espace GENESIS';
  loadAccueil();
  loadProfil();
}

// ── Navigation ──────────────────────────────────────
function goSection(name){
  document.querySelectorAll('.section').forEach(function(el){ el.classList.remove('on'); });
  document.querySelectorAll('.bnav-btn').forEach(function(el){ el.classList.remove('on'); });
  var sec = document.getElementById('sec-'+name);
  var btn = document.getElementById('btn-'+name);
  if(sec) sec.classList.add('on');
  if(btn) btn.classList.add('on');
  document.getElementById('main').scrollTop = 0;
  _currentSection = name;
  if(!_loaded[name]){
    _loaded[name] = true;
    if(name==='devis') loadDevis();
    if(name==='seances') loadSeances();
    if(name==='documents') loadDocs();
  }
}

// ── API fetch ───────────────────────────────────────
function apiFetch(path){ return fetch(API+path,{headers:{'Authorization':'Bearer '+_token}}).then(function(r){ return r.json(); }); }

// ── Format date ─────────────────────────────────────
function fmt(d){
  if(!d) return '—';
  try{
    return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
  }catch(e){ return d; }
}
function fmtAmt(n){ return n ? parseFloat(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+'€' : '—'; }

// ── Toast ───────────────────────────────────────────
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

// ── Accueil ─────────────────────────────────────────
function loadAccueil(){
  apiFetch('/api/partner/devis').then(function(data){
    var devis = Array.isArray(data) ? data : (data&&data.devis)||[];
    var pending = devis.filter(function(d){ return d.status==='pending'||d.status==='sent'; });
    document.getElementById('stat-devis').textContent = pending.length;
    var el = document.getElementById('home-devis-list');
    if(devis.length===0){ el.innerHTML = '<div class="empty"><i class="fa-solid fa-inbox"></i><p>Aucun devis reçu</p></div>'; return; }
    el.innerHTML = devis.slice(0,4).map(devisCard).join('');
  }).catch(function(){ document.getElementById('home-devis-list').innerHTML = '<div class="empty"><i class="fa-solid fa-wifi-slash"></i><p>Impossible de charger les devis</p></div>'; });
  apiFetch('/api/partner/orders').then(function(data){
    var orders = Array.isArray(data) ? data : (data&&data.orders)||[];
    var active = orders.filter(function(o){ return o.status==='in_progress'||o.status==='active'; });
    document.getElementById('stat-missions').textContent = active.length;
  }).catch(function(){ document.getElementById('stat-missions').textContent = '—'; });
  apiFetch('/api/partner/seances').then(function(data){
    var seances = Array.isArray(data) ? data : (data&&data.seances)||[];
    var future = seances.filter(function(s){ return s.start_date && new Date(s.start_date) >= new Date(); });
    document.getElementById('stat-seances').textContent = future.length;
  }).catch(function(){ document.getElementById('stat-seances').textContent = '—'; });
  apiFetch('/api/partner/contracts').then(function(data){
    var contracts = Array.isArray(data) ? data : [];
    document.getElementById('stat-docs').textContent = contracts.length;
  }).catch(function(){ document.getElementById('stat-docs').textContent = '—'; });
}

// ── Devis ───────────────────────────────────────────
function loadDevis(){
  var el = document.getElementById('devis-list');
  apiFetch('/api/partner/devis').then(function(data){
    var devis = Array.isArray(data) ? data : (data&&data.devis)||[];
    if(devis.length===0){ el.innerHTML = '<div class="empty"><i class="fa-solid fa-file-invoice"></i><p>Aucun devis reçu</p></div>'; return; }
    el.innerHTML = devis.map(devisCard).join('');
  }).catch(function(){ el.innerHTML = '<div class="empty"><i class="fa-solid fa-wifi-slash"></i><p>Erreur de chargement</p></div>'; });
}

function devisCard(d){
  var statusMap = {pending:'En attente',sent:'En attente',accepted:'Accepté',refused:'Refusé',expired:'Expiré'};
  var pillMap = {pending:'yellow',sent:'yellow',accepted:'green',refused:'red',expired:'grey'};
  var st = d.status||'pending';
  return '<div class="card" id="dv-'+d.id+'">'
    +'<div class="card-row">'
    +'<div class="card-icon" style="background:rgba(255,215,0,.08)"><i class="fa-solid fa-file-invoice" style="color:var(--gold)"></i></div>'
    +'<div style="flex:1;min-width:0">'
    +'<div class="card-title">'+esc(d.service||d.product_name||'Demande de devis')+'</div>'
    +'<div class="card-sub">'+esc(d.client_name||d.client_email||'Client')+(d.budget?' · Budget : '+esc(String(d.budget)):'')+'</div>'
    +'<div style="margin-top:5px;display:flex;align-items:center;justify-content:space-between">'
    +'<span class="pill pill-'+pillMap[st]+'">'+statusMap[st]+'</span>'
    +'<span class="card-meta">'+fmt(d.created_at)+'</span>'
    +'</div>'
    +'</div></div>'
    +(st==='pending'||st==='sent'?'<div class="dv-actions"><button class="btn-accept" onclick="respondDevis(\''+d.id+'\',\'accepted\',this)"><i class="fa-solid fa-check" style="margin-right:4px"></i>Accepter</button><button class="btn-refuse" onclick="respondDevis(\''+d.id+'\',\'refused\',this)"><i class="fa-solid fa-xmark" style="margin-right:4px"></i>Refuser</button></div>':'')
    +'</div>';
}

function respondDevis(id, action, btn){
  var card = document.getElementById('dv-'+id);
  var btns = card ? card.querySelectorAll('button') : [];
  btns.forEach(function(b){ b.disabled=true; });
  fetch(API+'/api/partner/devis/'+id+'/respond',{
    method:'POST',
    headers:{'Authorization':'Bearer '+_token,'Content-Type':'application/json'},
    body:JSON.stringify({action:action})
  }).then(function(r){ return r.json(); }).then(function(){
    showToast(action==='accepted'?'Devis accepté ✓':'Devis refusé');
    _loaded['devis']=false; _loaded['accueil']=false;
    goSection(_currentSection);
    loadAccueil();
    if(_currentSection==='devis') loadDevis();
  }).catch(function(){ btns.forEach(function(b){ b.disabled=false; }); showToast('Erreur, réessayez'); });
}

// ── Séances ─────────────────────────────────────────
function loadSeances(){
  var el = document.getElementById('seances-list');
  apiFetch('/api/partner/seances').then(function(data){
    var seances = Array.isArray(data) ? data : (data&&data.seances)||[];
    if(seances.length===0){ el.innerHTML = '<div class="empty"><i class="fa-solid fa-calendar"></i><p>Aucune séance planifiée</p></div>'; return; }
    el.innerHTML = seances.map(function(s){
      var d = fmt(s.start_date||s.date);
      var past = s.start_date && new Date(s.start_date) < new Date();
      return '<div class="card"><div class="card-row">'
        +'<div class="card-icon" style="background:rgba(96,165,250,.08)"><i class="fa-solid fa-calendar-check" style="color:#60a5fa"></i></div>'
        +'<div style="flex:1;min-width:0">'
        +'<div class="card-title">'+esc(s.product_name||s.service||'Séance')+'</div>'
        +'<div class="card-sub">'+esc(s.client_name||s.client_email||'Client')+'</div>'
        +'<div style="margin-top:5px;display:flex;align-items:center;justify-content:space-between">'
        +'<span class="pill '+(past?'pill-grey':'pill-blue')+'"><i class="fa-regular fa-clock" style="margin-right:3px"></i>'+d+(s.time?' à '+s.time:'')+'</span>'
        +'<span class="card-meta">'+(s.duration?s.duration+' min':'')+'</span>'
        +'</div></div></div></div>';
    }).join('');
  }).catch(function(){ el.innerHTML = '<div class="empty"><i class="fa-solid fa-wifi-slash"></i><p>Erreur de chargement</p></div>'; });
}

// ── Documents ────────────────────────────────────────
function loadDocs(){
  var el = document.getElementById('docs-list');
  apiFetch('/api/partner/contracts').then(function(contracts){
    if(!Array.isArray(contracts)||contracts.length===0){
      el.innerHTML = '<div class="empty"><i class="fa-solid fa-folder-open"></i><p>Aucun document disponible</p></div>'; return;
    }
    var partnership = contracts.filter(function(c){ return c.type==='partnership'; });
    var service = contracts.filter(function(c){ return c.type==='service'; });
    var html = '';
    if(partnership.length>0){
      html += '<div class="sec-hdr" style="margin-top:4px"><i class="fa-solid fa-handshake"></i>Contrat de partenariat</div>';
      html += partnership.map(docCard).join('');
    }
    if(service.length>0){
      html += '<div class="sec-hdr" style="margin-top:14px"><i class="fa-solid fa-file-signature"></i>Contrats de prestation</div>';
      html += service.map(docCard).join('');
    }
    el.innerHTML = html;
  }).catch(function(){ el.innerHTML = '<div class="empty"><i class="fa-solid fa-wifi-slash"></i><p>Erreur de chargement</p></div>'; });
}

function docCard(c){
  var signed = c.status==='signed';
  var pending = c.status==='pending_client_signature';
  var badge = signed?'Signé':(pending?'En attente client':'Non signé');
  var pillCls = signed?'pill-green':(pending?'pill-yellow':'pill-grey');
  var iconColor = signed?'#22c55e':(pending?'var(--gold)':'var(--muted)');
  var iconBg = signed?'rgba(34,197,94,.08)':(pending?'rgba(255,215,0,.08)':'rgba(255,255,255,.04)');
  var label = c.type==='partnership'?'Contrat de partenariat FA GENESIS':(c.service_name||'Contrat de prestation');
  return '<div class="card"><div class="card-row">'
    +'<div class="card-icon" style="background:'+iconBg+'"><i class="fa-solid fa-file-contract" style="color:'+iconColor+'"></i></div>'
    +'<div style="flex:1;min-width:0">'
    +'<div class="card-title">'+esc(label)+'</div>'
    +'<div class="card-sub">'+(c.client_name||'')+(c.signed_at?' · '+fmt(c.signed_at):'')+'</div>'
    +'<div style="margin-top:5px;display:flex;align-items:center;justify-content:space-between">'
    +'<span class="pill '+pillCls+'">'+badge+'</span>'
    +'<span class="card-meta">'+fmt(c.created_at)+'</span>'
    +'</div>'
    +'</div></div>'
    +(signed?'<button class="btn-gold" style="margin-top:10px" onclick="downloadPdf(\''+c.id+'\')"><i class="fa-solid fa-download"></i>Télécharger le PDF</button>':'')
    +'</div>';
}

function downloadPdf(id){ window.open(API+'/api/contracts/'+id+'/pdf','_blank'); }

// ── Profil ───────────────────────────────────────────
function loadProfil(){
  if(!_partner) return;
  var fn = ((_partner.prenom||'')+' '+(_partner.nom||'')).trim()||_partner.email;
  var ini = (fn[0]||'P').toUpperCase();
  document.getElementById('pf-avatar').textContent = ini;
  document.getElementById('pf-name').textContent = fn;
  var typeMap = {photographer:'Photographe',videographer:'Vidéaste',graphic_designer:'Graphiste',developer:'Développeur',marketer:'Marketeur',coach:'Coach',consultant:'Consultant',event_planner:'Organisateur d\'événements',writer:'Rédacteur',translator:'Traducteur',other:'Prestataire'};
  document.getElementById('pf-type').textContent = typeMap[_partner.partner_type]||_partner.partner_type||'Prestataire';
  var badge = _partner.badge||'Bronze';
  var badgeColors = {Bronze:'#cd7f32',Argent:'#aaa',Or:'#FFD700',Elite:'#c0e0ff'};
  document.getElementById('pf-badge-row').innerHTML = '<span class="pill" style="background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);color:'+(badgeColors[badge]||'#FFD700')+'"><i class="fa-solid fa-medal" style="margin-right:4px"></i>'+badge+'</span>';
  var rows = [
    {icon:'fa-envelope',label:'Email',val:_partner.email||'—'},
    {icon:'fa-phone',label:'Téléphone',val:_partner.phone||'—'},
    {icon:'fa-location-dot',label:'Pays',val:_partner.country||'—'},
    {icon:'fa-calendar',label:'Membre depuis',val:fmt(_partner.created_at)},
  ];
  document.getElementById('pf-info').innerHTML = rows.map(function(r){
    return '<div class="pf-row"><i class="fa-solid '+r.icon+'"></i><div><span class="label">'+r.label+'</span><span class="val">'+esc(String(r.val))+'</span></div></div>';
  }).join('');
}

// ── Logout ───────────────────────────────────────────
function doLogout(){
  if(!confirm('Se déconnecter ?')) return;
  try{ localStorage.removeItem('fa_genesis_partner_token'); }catch(e){}
  try{ localStorage.removeItem('fa_genesis_partner_data'); }catch(e){}
  try{ localStorage.removeItem('fa_genesis_partner_profile'); }catch(e){}
  try{ fetch(API+'/api/partner/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+_token}}).catch(function(){}); }catch(e){}
  window.location.replace('partner-login.html');
}

// ── Utils ─────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
