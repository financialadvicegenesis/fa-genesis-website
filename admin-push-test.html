<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test notifications push — GENESIS</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#eee;max-width:560px;margin:0 auto;padding:24px 18px;}
  h1{font-size:18px;color:#FFD700;margin-bottom:4px;}
  p.sub{color:#888;font-size:13px;margin-bottom:24px;line-height:1.5;}
  label{display:block;font-size:12px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;margin-top:16px;}
  input,select{width:100%;box-sizing:border-box;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;padding:10px 12px;font-size:14px;}
  button{margin-top:20px;width:100%;background:#FFD700;color:#000;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  #result{margin-top:20px;padding:14px;border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap;display:none;}
  #result.ok{background:#0d1f0d;border:1px solid #2d5a2d;color:#7fd87f;}
  #result.fail{background:#1f0d0d;border:1px solid #5a2d2d;color:#d87f7f;}
  #tokenWarn{background:#1f1a0d;border:1px solid #5a4a2d;color:#d8b87f;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:16px;display:none;}
</style>
</head>
<body>
  <h1>🔔 Test notifications push</h1>
  <p class="sub">Envoie une vraie notification FCM directement à un compte, sans passer par un message ou une commande — pour isoler immédiatement où ça bloque.</p>

  <div id="tokenWarn">Aucune session admin détectée. Ouvrez <a href="admin.html" style="color:#FFD700">admin.html</a> et connectez-vous d'abord, puis revenez ici.</div>

  <label>Email du compte à tester</label>
  <input id="email" type="email" placeholder="prestataire@exemple.com">

  <label>Type de compte</label>
  <select id="role">
    <option value="partner">Prestataire</option>
    <option value="client">Client</option>
  </select>

  <button id="btn" onclick="runTest()">Envoyer une notification de test</button>

  <div id="result"></div>

<script>
function _adminToken(){ return localStorage.getItem('fa_genesis_admin_token') || ''; }
if(!_adminToken()){ document.getElementById('tokenWarn').style.display = 'block'; }

var API = window.location.hostname === 'localhost' ? 'http://localhost:3001' : 'https://fa-genesis-website.onrender.com';

function runTest(){
  var email = document.getElementById('email').value.trim();
  var role = document.getElementById('role').value;
  var btn = document.getElementById('btn');
  var result = document.getElementById('result');
  if(!email){ alert('Entrez un email.'); return; }
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  result.style.display = 'none';

  fetch(API + '/api/admin/push/test-fcm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _adminToken() },
    body: JSON.stringify({ email: email, role: role })
  }).then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
  .then(function(res){
    btn.disabled = false; btn.textContent = 'Envoyer une notification de test';
    var d = res.data;
    if(res.status === 403){
      result.className = 'fail'; result.style.display = 'block';
      result.textContent = 'Accès refusé — reconnectez-vous sur admin.html puis revenez ici.';
      return;
    }
    var lines = [];
    if(!d.ok){
      result.className = 'fail';
      if(d.step === 'firebase') lines.push('❌ ÉTAPE : Firebase\n' + d.detail);
      else if(d.step === 'user_lookup') lines.push('❌ ÉTAPE : Recherche du compte\n' + d.detail);
      else if(d.step === 'token_lookup') lines.push('❌ ÉTAPE : Token de l\'appareil\n' + d.detail + '\n\n→ Demandez à la personne de rouvrir complètement l\'app GENESIS une fois, puis relancez ce test.');
      else lines.push('❌ Erreur : ' + (d.detail || d.error || 'inconnue'));
    } else {
      result.className = 'ok';
      lines.push('✅ ' + d.tokenCount + ' appareil(s) trouvé(s), notification envoyée par Firebase.\n');
      d.results.forEach(function(r, i){
        lines.push('Appareil ' + (i+1) + ' (' + (r.platform||'?') + ', enregistré le ' + (r.registered_at ? new Date(r.registered_at).toLocaleString('fr-FR') : '?') + ') :');
        if(r.success){
          lines.push('  ✅ Accepté par Firebase (id: ' + r.messageId + ')');
          lines.push('  → Si RIEN n\'apparaît sur le téléphone malgré ça, le problème est 100% côté téléphone (canal de notification, permission, ou optimisation batterie agressive du fabricant) — plus côté serveur.');
        } else {
          lines.push('  ❌ Refusé par Firebase : ' + r.error + (r.code ? ' (code: ' + r.code + ')' : ''));
          if(r.code === 'messaging/registration-token-not-registered' || r.code === 'messaging/invalid-registration-token'){
            lines.push('  → Le token est périmé (app désinstallée/réinstallée, ou cache vidé). La personne doit rouvrir l\'app pour en générer un nouveau.');
          }
        }
      });
    }
    result.textContent = lines.join('\n');
    result.style.display = 'block';
  }).catch(function(e){
    btn.disabled = false; btn.textContent = 'Envoyer une notification de test';
    result.className = 'fail'; result.style.display = 'block';
    result.textContent = 'Erreur réseau : ' + e.message;
  });
}
</script>
</body>
</html>
