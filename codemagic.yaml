workflows:
  ios-app-store:
    name: GENESIS iOS App Store
    max_build_duration: 60
    integrations:
      app_store_connect: genesis_app_store_connect
    environment:
      groups:
        - CERTIFICATE_PRIVATE_KEY
      node: 20.0.0
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APP_ID: Env:APP_STORE_APP_ID
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set bundle version from build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up keychain
        # fetch-signing-files --create génère une clé privée localement et a besoin
        # d'un keychain initialisé pour la sauvegarder — sans cette étape, la commande
        # échoue avec "Cannot save Signing Certificates without certificate private key"
        # même quand CERTIFICATE_PRIVATE_KEY est bien défini.
        script: |
          keychain initialize
      - name: Fetch signing files
        # Manquait dans la configuration initiale : xcode-project use-profiles se contente
        # d'UTILISER des certificats/profils déjà présents localement sur l'agent de build, il
        # n'en crée jamais. Sans cette étape, "No matching profiles found" était inévitable dès
        # lors qu'aucun certificat de distribution n'existait encore sur le compte développeur
        # (confirmé vide avant ce correctif) — cette commande les génère via l'API App Store
        # Connect (clé Admin requise) directement sur la machine Mac de Codemagic.
        # Le CLI ne lit PAS CERTIFICATE_PRIVATE_KEY automatiquement malgré ce que suggère
        # son nom — il faut le passer explicitement via --certificate-key, sinon
        # "Cannot save Signing Certificates without certificate private key".
        script: |
          app-store-connect fetch-signing-files "com.fagenesis.genesis" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
