workflows:
  ios-app-store:
    name: GENESIS iOS App Store
    max_build_duration: 60
    integrations:
      app_store_connect: genesis_app_store_connect
    environment:
      groups:
        - CERTIFICATE_PRIVATE_KEY
      node: 20.0.0
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APP_ID: Env:APP_STORE_APP_ID
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Register reply-from-notification category (AppDelegate)
        # Équivalent iOS du bouton "Répondre" Android (GenesisMessagingService + ReplyReceiver) :
        # une UNNotificationCategory avec une UNTextInputNotificationAction, enregistrée une fois
        # au lancement. Le serveur attache cette catégorie (aps.category = "GENESIS_REPLY", voir
        # server.js sendFcmToUser) uniquement aux notifications de message. La réponse tapée est
        # ensuite récupérée en JS via l'événement notificationActionPerformed du plugin
        # (event.actionId / event.inputValue, déjà exposés nativement par @capacitor-firebase/
        # messaging — pas besoin d'implémenter notre propre UNUserNotificationCenterDelegate, qui
        # entrerait en conflit avec celui du plugin). Limite connue et acceptée : si l'app a été
        # fermée de force (swipe) par l'utilisateur plutôt que simplement mise en arrière-plan,
        # ce chemin JS peut ne pas s'exécuter — seul un vrai delegate natif (hors de portée ici
        # sans casser le delegate du plugin) couvrirait aussi ce cas précis.
        # Script Ruby passé via heredoc à délimiteur entre quotes ('RUBYEOF') : bash n'y interprète
        # RIEN (ni guillemets, ni backslashes, ni $) — évite tout risque d'échappement imbriqué
        # bash-dans-Ruby-dans-Swift, bien plus fragile avec `ruby -e "..."` pour un script de
        # cette taille.
        script: |
          ruby << 'RUBYEOF'
          content = File.read('ios/App/App/AppDelegate.swift')
          content = content.sub('import Capacitor', "import Capacitor\nimport UserNotifications")
          swift_snippet = <<~SWIFT.chomp
            // Override point for customization after application launch.
                let replyAction = UNTextInputNotificationAction(identifier: "REPLY_ACTION", title: "Répondre", options: [], textInputButtonTitle: "Envoyer", textInputPlaceholder: "Message...")
                let messageCategory = UNNotificationCategory(identifier: "GENESIS_REPLY", actions: [replyAction], intentIdentifiers: [], options: [])
                UNUserNotificationCenter.current().setNotificationCategories([messageCategory])
                return true
          SWIFT
          content = content.sub(
            "// Override point for customization after application launch.\n        return true",
            swift_snippet
          )
          File.write('ios/App/App/AppDelegate.swift', content)
          RUBYEOF
      - name: Clear app icon badge on foreground (parity with Android onResume)
        # Équivalent iOS de MainActivity.onResume() → BadgeUtils.setBadgeCount(this, 0) côté Android.
        # Sans ça, le badge posé par un push (aps.badge, voir server.js _computeNotificationBadgeCount)
        # restait affiché indéfiniment sur l'icône après ouverture/lecture des messages dans l'app —
        # TokenStore.refreshBadge() (mobile-bridge.js) est un plugin natif Android-only (TokenStorePlugin.java)
        # et no-op silencieusement sur iOS, donc rien d'autre ne remet le badge iOS à zéro. Couvre le cas
        # dominant (l'utilisateur rouvre/revient sur l'app) ; le cas plus rare "lire un message sans jamais
        # quitter l'app au premier plan" resterait obsolète jusqu'au prochain cycle arrière-plan/premier plan
        # — accepté comme limitation mineure plutôt que construire un plugin natif dédié pour ce seul cas.
        script: |
          ruby << 'RUBYEOF'
          content = File.read('ios/App/App/AppDelegate.swift')
          content = content.sub(
            "func applicationDidBecomeActive(_ application: UIApplication) {\n        // Restart any tasks that were paused (or not yet started) while the application was inactive. If the application was previously in the background, optionally refresh the user interface.\n    }",
            "func applicationDidBecomeActive(_ application: UIApplication) {\n        // Restart any tasks that were paused (or not yet started) while the application was inactive. If the application was previously in the background, optionally refresh the user interface.\n        UIApplication.shared.applicationIconBadgeNumber = 0\n    }"
          )
          File.write('ios/App/App/AppDelegate.swift', content)
          RUBYEOF
      - name: Add Firebase push notification bridging (AppDelegate)
        # AppDelegate.swift est régénéré à neuf (template Capacitor vanilla, ios/ gitignored) à
        # chaque build — @capacitor-firebase/messaging exige ces 3 méthodes pour transmettre les
        # événements d'enregistrement APNs au SDK Firebase (pont APNs→FCM). Sans ça, le plugin ne
        # reçoit jamais le jeton APNs natif et ne peut donc jamais produire de jeton FCM iOS.
        script: |
          sed -i '' '$d' ios/App/App/AppDelegate.swift
          cat >> ios/App/App/AppDelegate.swift << 'EOF'
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }

              func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable : Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
                  NotificationCenter.default.post(name: Notification.Name.init("didReceiveRemoteNotification"), object: completionHandler, userInfo: userInfo)
              }
          }
          EOF
      - name: Add push notification entitlements (aps-environment)
        # Cause du "No APNS token specified before fetching FCM Token" en boucle (confirmé par
        # instrumentation diagnostique) : ni Capacitor ni @capacitor-firebase/messaging ne créent
        # de fichier d'entitlements iOS — sans déclarer aps-environment, l'app ne demande jamais
        # réellement la capacité push à la signature, même si "Push Notifications" est activé sur
        # l'App ID Apple et que le profil récupéré l'autorise. "production" (et non "development")
        # car notre profil est de type distribution (IOS_APP_STORE) — TestFlight utilise
        # l'environnement APNs production, pas sandbox, contrairement à l'intuition courante.
        script: |
          cat > ios/App/App/App.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>aps-environment</key>
          	<string>production</string>
          </dict>
          </plist>
          EOF
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          project.save
          "
      - name: Restrict to iPhone only (no iPad)
        # L'app n'a jamais été conçue ni testée sur un écran iPad (barre de navigation en bas,
        # mise en page mobile) — Capacitor configure "Universel" (iPhone+iPad) par défaut
        # (TARGETED_DEVICE_FAMILY "1,2"), jamais changé jusqu'ici. "1" seul = iPhone uniquement :
        # évite de livrer une expérience tablette non testée, et élimine l'exigence Apple de
        # capture d'écran iPad 13 pouces pour la soumission.
        script: |
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          target.build_configurations.each do |config|
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1'
          end
          project.save
          "
      - name: Set bundle version from build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          # Déclare directement que l'app n'utilise que le chiffrement HTTPS standard du système
          # (aucun algorithme propriétaire/personnalisé) — évite la question de conformité export
          # posée manuellement à chaque build (déjà répondue identiquement plusieurs fois ce jour).
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
      - name: Apply GENESIS branding (icon + splash screen)
        # Parité avec Android : sans ceci, l'app iOS affiche l'icône et l'écran de démarrage
        # génériques par défaut de Capacitor (jamais remplacés jusqu'ici) au lieu du logo GENESIS.
        # Assets.xcassets est une seule référence de dossier dans le projet Xcode (contrairement à
        # GoogleService-Info.plist plus haut) : remplacer les PNG qu'il contient suffit, pas besoin
        # du gem xcodeproj ici. Fond BLANC (demande explicite) : logo seul (fond transparent)
        # composité sur blanc dans Splash-2732.png — LaunchScreen.storyboard garde son blanc par
        # défaut (white="1"), pas besoin de le patcher ici contrairement à la version précédente.
        script: |
          cp ios-config/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          cp ios-config/Splash-2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
          cp ios-config/Splash-2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          cp ios-config/Splash-2732.png ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
      - name: Copy Firebase iOS config
        # ios/ est régénéré à neuf à chaque build (gitignored) — ce fichier de config Firebase
        # (non sensible : identifiants publics liés au bundle ID, pas un secret) est donc commité
        # ailleurs dans le repo et recopié ici avant pod install/build, sinon le SDK Firebase
        # iOS (@capacitor-firebase/messaging) n'a aucune configuration à charger au démarrage.
        script: |
          cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: Register GoogleService-Info.plist in Xcode project
        # Cause du crash au lancement sur le build 13 : "cp" seul copie le fichier sur le disque
        # mais ne l'enregistre pas dans project.pbxproj — Xcode ne l'inclut donc jamais dans le
        # bundle compilé de l'app, et FirebaseApp.configure() (appelé automatiquement par le SDK)
        # plante immédiatement au démarrage en ne le trouvant pas dans le bundle. xcodeproj (gem
        # Ruby fournie par CocoaPods, déjà présente sur l'agent) ajoute la vraie référence pour
        # qu'Xcode copie réellement le fichier dans l'app à la compilation.
        script: |
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          group = project.main_group.find_subpath('App', true)
          file_ref = group.new_reference('GoogleService-Info.plist')
          target.resources_build_phase.add_file_reference(file_ref)
          project.save
          "
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up keychain
        # fetch-signing-files --create génère une clé privée localement et a besoin
        # d'un keychain initialisé pour la sauvegarder — sans cette étape, la commande
        # échoue avec "Cannot save Signing Certificates without certificate private key"
        # même quand CERTIFICATE_PRIVATE_KEY est bien défini.
        script: |
          keychain initialize
      - name: Fetch signing files
        # Manquait dans la configuration initiale : xcode-project use-profiles se contente
        # d'UTILISER des certificats/profils déjà présents localement sur l'agent de build, il
        # n'en crée jamais. Sans cette étape, "No matching profiles found" était inévitable dès
        # lors qu'aucun certificat de distribution n'existait encore sur le compte développeur
        # (confirmé vide avant ce correctif) — cette commande les génère via l'API App Store
        # Connect (clé Admin requise) directement sur la machine Mac de Codemagic.
        # Le CLI ne lit PAS CERTIFICATE_PRIVATE_KEY automatiquement malgré ce que suggère
        # son nom — il faut le passer explicitement via --certificate-key, sinon
        # "Cannot save Signing Certificates without certificate private key".
        script: |
          app-store-connect fetch-signing-files "com.fagenesis.genesis" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
