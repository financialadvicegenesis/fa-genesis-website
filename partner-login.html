<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo-favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/logo-favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/images/logo-favicon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/images/logo-favicon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <title>Connexion Partenaire - FA GENESIS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Space+Grotesk:wght@300;700&display=swap">
    <link rel="stylesheet" href="tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
    <style>

        :root {
            --genesis-yellow: #FFD700;
            --genesis-black: #000000;
            --genesis-white: #FFFFFF;
        }

        body {
            background-color: var(--genesis-black);
            color: var(--genesis-white);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, .nav-link { font-family: 'Unbounded', cursive; }

        .neo-border { border: 4px solid var(--genesis-black); }
        .neo-shadow { box-shadow: 10px 10px 0px 0px var(--genesis-yellow); }

        .neo-btn-yellow {
            background: var(--genesis-yellow);
            color: black;
            border: 4px solid black;
            box-shadow: 6px 6px 0px black;
            font-weight: 900;
            transition: 0.1s;
        }
        .neo-btn-yellow:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px black;
        }

        .error-message {
            display: none;
            background: #ff0000;
            color: white;
            padding: 1rem;
            border: 4px solid black;
            margin-bottom: 1.5rem;
            font-weight: bold;
        }
        .error-message.show { display: block; }
    </style>
    <meta name="theme-color" content="#FFD700">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FA GENESIS">
</head>
<body>

    <!-- NAVIGATION APP (sans liens marketing) -->
    <nav class="fixed top-0 w-full z-50 bg-black/95 backdrop-blur-md border-b-4 border-[var(--genesis-yellow)] px-4 md:px-6 py-3 md:py-4 flex justify-between items-center text-white text-xs font-black uppercase">
        <a href="app.html" class="flex items-center gap-2 md:gap-3 text-lg md:text-2xl font-black tracking-wider text-[var(--genesis-yellow)]" style="font-family: 'Unbounded', cursive;"><img src="assets/images/logo-favicon-192.png" alt="Logo FA GENESIS" style="height:48px;width:48px;flex-shrink:0;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:middle;"> FA GENESIS</a>
        <a href="app.html" class="text-white font-black text-xs md:text-sm hover:text-[var(--genesis-yellow)] transition"><i class="fas fa-arrow-left mr-1"></i>Retour à l'app</a>
    </nav>

    <!-- LOGIN SECTION - PAS DE AOS -->
    <section class="min-h-screen flex flex-col items-center justify-center p-6 bg-black pt-32 relative overflow-hidden">
        <div class="absolute top-20 left-[-10%] w-96 h-96 bg-[var(--genesis-yellow)] rounded-full blur-[120px] opacity-20 z-0"></div>

        <div class="w-full max-w-xl z-10">
            <h1 class="text-5xl md:text-7xl font-black italic uppercase text-center mb-4 text-[var(--genesis-yellow)]">ESPACE PARTENAIRE</h1>
            <p class="text-center text-lg font-bold mb-12 uppercase opacity-80">Connectez-vous pour accéder à vos projets</p>

            <div class="bg-white text-black p-10 neo-border neo-shadow">
                <div id="errorMessage" class="error-message"></div>

                <form id="partnerLoginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-black mb-2 uppercase">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            class="w-full bg-white text-black p-4 border-4 border-black font-bold outline-none focus:border-[var(--genesis-yellow)] transition-all"
                            placeholder="votre.email@exemple.com"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-black mb-2 uppercase">Mot de passe</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="w-full bg-white text-black p-4 border-4 border-black font-bold outline-none focus:border-[var(--genesis-yellow)] transition-all"
                            placeholder="••••••••"
                        >
                    </div>

                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full py-4 neo-btn-yellow text-2xl font-black italic uppercase tracking-tighter"
                    >
                        Se connecter
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-sm font-bold opacity-60">
                        <i class="fas fa-info-circle mr-1"></i>
                        Pas encore de compte ? Inscrivez-vous en tant que partenaire ci-dessous.
                    </p>
                </div>
            </div>

            <div class="mt-8 text-center">
                <p class="text-white font-bold">Pas encore partenaire ? <a href="partner-register.html" class="text-[var(--genesis-yellow)] underline font-black">Devenir partenaire</a></p>
                <p class="text-white font-bold mt-4">Mot de passe oublié ? <button type="button" onclick="toggleForgot()" class="text-[var(--genesis-yellow)] underline font-black bg-transparent border-0 cursor-pointer p-0" style="font-size:inherit;font-family:inherit;">Réinitialiser</button></p>
                <div id="forgotSection" style="display:none;margin-top:16px;background:#111;border:1.5px solid #FFD700;border-radius:12px;padding:20px;text-align:left;">
                  <p style="color:#fff;font-weight:700;margin-bottom:12px;font-size:14px;">Réinitialisation du mot de passe</p>
                  <input id="forgotEmail" type="email" placeholder="Votre adresse email" style="width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px 14px;color:#fff;font-size:15px;font-family:inherit;margin-bottom:10px;box-sizing:border-box;">
                  <div id="forgotErr" style="display:none;color:#ff4444;font-size:13px;margin-bottom:8px;"></div>
                  <div id="forgotOk" style="display:none;color:#4caf50;font-size:13px;margin-bottom:8px;line-height:1.5;"></div>
                  <button type="button" id="forgotBtn" onclick="doForgot()" style="width:100%;background:#FFD700;color:#000;border:none;border-radius:8px;padding:13px;font-family:inherit;font-size:12px;font-weight:900;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;">Envoyer le lien</button>
                </div>
                <p class="text-white font-bold mt-4 opacity-60 text-sm">
                    <a href="login.html" class="text-white underline hover:text-[var(--genesis-yellow)]">Espace Client</a>
                </p>
            </div>
        </div>
    </section>

    <script src="config.js"></script>
    <script src="partner-auth.js"></script>
    <script>
        function toggleForgot() {
            var s = document.getElementById('forgotSection');
            if (s) s.style.display = s.style.display === 'none' ? 'block' : 'none';
        }

        function doForgot() {
            var email = (document.getElementById('forgotEmail') || {}).value || '';
            var errEl = document.getElementById('forgotErr');
            var okEl = document.getElementById('forgotOk');
            var btn = document.getElementById('forgotBtn');
            if (!email) {
                if (errEl) { errEl.textContent = 'Veuillez saisir votre email.'; errEl.style.display = 'block'; }
                return;
            }
            if (errEl) errEl.style.display = 'none';
            if (okEl) okEl.style.display = 'none';
            if (btn) { btn.disabled = true; btn.textContent = 'Envoi en cours...'; }
            var API = (window.FA_GENESIS_API) || 'https://fa-genesis-website.onrender.com';
            fetch(API + '/api/partner/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            }).then(function(r) { return r.json(); }).then(function() {
                if (btn) { btn.disabled = false; btn.textContent = 'Envoyer le lien'; }
                if (okEl) { okEl.textContent = 'Si cet email est enregistré, vous allez recevoir un lien de réinitialisation dans quelques minutes.'; okEl.style.display = 'block'; }
            }).catch(function() {
                if (btn) { btn.disabled = false; btn.textContent = 'Envoyer le lien'; }
                if (errEl) { errEl.textContent = 'Erreur réseau. Vérifiez votre connexion et réessayez.'; errEl.style.display = 'block'; }
            });
        }

        // Verifier si deja connecte
        if (isPartnerAuthenticated()) {
            window.location.href = 'partner-dashboard.html';
        }

        // Gestion de la soumission du formulaire
        var partnerLoginFormEl = document.getElementById('partnerLoginForm');
        if (partnerLoginFormEl) {
            partnerLoginFormEl.addEventListener('submit', async function(e) {
                e.preventDefault();

                var email = document.getElementById('email').value;
                var password = document.getElementById('password').value;
                var errorMessage = document.getElementById('errorMessage');
                var submitBtn = document.getElementById('submitBtn');

                // Desactiver le bouton
                submitBtn.disabled = true;
                submitBtn.textContent = 'Connexion en cours...';

                // Tentative de connexion
                var result = await partnerLogin(email, password);

                // Reactiver le bouton
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';

                if (result.success) {
                    window.location.href = 'partner-dashboard.html';
                } else {
                    errorMessage.textContent = result.message;
                    errorMessage.classList.add('show');

                    setTimeout(function() {
                        errorMessage.classList.remove('show');
                    }, 5000);
                }
            });
        }

    </script>
    <script src="pwa-init.js"></script>
</body>
</html>
