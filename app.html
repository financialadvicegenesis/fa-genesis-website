<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FA GENESIS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FA GENESIS">
<link rel="apple-touch-icon" href="assets/images/logo-favicon-192.png">
<link rel="icon" href="assets/images/logo-favicon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  overflow:hidden;
}
.logo{
  width:100px;height:100px;border-radius:50%;object-fit:cover;
  animation:pop .7s cubic-bezier(.34,1.56,.64,1) .3s both;
}
.logo-fallback{
  width:100px;height:100px;border-radius:50%;background:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:#FFD700;
  animation:pop .7s cubic-bezier(.34,1.56,.64,1) .3s both;
}
.name{
  font-size:24px;font-weight:900;color:#FFD700;
  letter-spacing:3px;margin-top:28px;
  text-transform:uppercase;
  animation:up .6s ease .7s both;
}
.sub{
  font-size:10px;color:#444;letter-spacing:2px;
  margin-top:8px;text-transform:uppercase;
  animation:up .6s ease .9s both;
}
.bar-wrap{
  width:56px;height:3px;background:#1a1a1a;
  border-radius:99px;overflow:hidden;margin-top:48px;
  animation:up .4s ease 1.1s both;
}
.bar{
  height:100%;background:#FFD700;border-radius:99px;
  animation:fill 1.6s ease 1.2s both;
}
@keyframes pop{
  0%{opacity:0;transform:scale(.5)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes up{
  0%{opacity:0;transform:translateY(14px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes fill{0%{width:0}100%{width:100%}}
.link{
  position:absolute;bottom:40px;
  font-size:12px;color:#333;text-decoration:none;
}
</style>
</head>
<body>

<img
  class="logo"
  src="assets/images/logo-favicon-192.png"
  alt="FA GENESIS"
  onerror="this.outerHTML='<div class=\'logo-fallback\'>FA</div>'"
>
<div class="name">FA GENESIS</div>
<div class="sub">Développez vos projets</div>
<div class="bar-wrap"><div class="bar"></div></div>

<a href="index.html" class="link">Accéder au site →</a>

<script>
(function(){
  // Désenregistrer l'ancien service worker au besoin
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(reg) {
        reg.update(); // forcer la vérification de mise à jour
      });
    });
  }

  function go() {
    try {
      var s = localStorage.getItem('fa_genesis_session');
      var t = localStorage.getItem('fa_genesis_token');
      if (s && t) {
        window.location.replace('espace-client.html');
      } else {
        window.location.replace('index.html');
      }
    } catch(e) {
      window.location.replace('index.html');
    }
  }

  // Lancement après 2.5s
  setTimeout(go, 2500);
})();
</script>

</body>
</html>
